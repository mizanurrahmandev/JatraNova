name: jatra_nova
description: "JatraNova - Intercity Bus Ticketing Demo App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get_it: ^9.3.0
  go_router: ^17.5.0
  injectable: ^3.0.0
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/backgrounds/splash_background.jpg
    - assets/images/bus_logo.png
    - assets/images/bus_icon.jpg
    - assets/images/google_logo.png
    - assets/backgrounds/background_onboarding.jpg
    - assets/backgrounds/background_langulage.jpg
    - assets/backgrounds/background.png
    - assets/backgrounds/reset_password_bg.jpg
    - assets/illustrations/illustration_1.png
    - assets/illustrations/illustration_2.png
    - assets/illustrations/illustration_3.png
    - assets/illustrations/email_illustration.png
    - assets/illustrations/bus_illustration.png
